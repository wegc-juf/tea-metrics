# Template for gridded data TEA indicators; for details and available options see CFG-PARAMS-doc.md
common_params:
  input_data: &DATA
    dataset: SPARTACUS
  GeoRegion: &GR
    region: AUT
    agr: AUT
    grg_grid_spacing: 10000
    grg_cell_size: 30000
  parameter: &PARAM
    parameter: Tx
    precip: false
    threshold_type: abs
    threshold: 30
    unit: degC
    low_extreme: false
  time_params: &TIME
    start: 1961
    end: 2025
    period: annual
    ref_period: 1961-1990
    cc_period: 2011-2025
  paths: &PATHS
    input_data_path: &inputpath /data/arsclisys/normal/clim-hydro/TEA-Indicators/SPARTACUS/reproj_UTM33N/v2.1/
    hourly_data_path: /data/arsclisys/normal/clim-hydro/TEA-Indicators/SPARTACUS/reproj_UTM33N/v2.1/
    statpath: &statpath /tank/local/TEA/test/static/
    maskpath: *statpath
    mask_sub: masks/
    outpath: /tank/local/TEA/test/
  general: &GENERAL
    use_dask: auto

create_region_masks:
  <<: *GR
  <<: *PARAM
  <<: *TIME
  <<: *DATA
  <<: *PATHS
  gr_type: polygon
  shpfile: /data/reloclim/backup/GEO/shapefiles/OEKS15/good/AUSTRIA.shp
  target_sys: 32633
  orofile: /data/arsclisys/normal/clim-hydro/TEA-Indicators/SPARTACUS/reproj_UTM33N/v2.1/SPARTACUSreg_orography.nc
  mask_parallel_workers: 40

calc_TEA:
  <<: *GR
  <<: *PARAM
  <<: *TIME
  <<: *DATA
  <<: *PATHS
  <<: *GENERAL
  recalc_threshold: false
  recalc_daily: false
  hourly: false
  decadal: true
  recalc_decadal: true
  spreads: false
  annual_spreads: false
  decadal_only: false
  grg_tile_workers: 20

regrid_SPARTACUS_to_WEGNext:
  <<: *GR
  <<: *PARAM
  <<: *DATA
  <<: *PATHS
  <<: *TIME
  <<: *GENERAL
  raw_data_path: /data/arsclisys/normal/clim-hydro/TEA-Indicators/SPARTACUS_raw/v2025_v2.1/
  regridded_data_path: *inputpath
  wegn_file: /var/wegnet/wegc203058/netcdf/WEA/WN_L2_HHD_v7_UTM_TF1_UTC_2020-08.nc
  orography: false
